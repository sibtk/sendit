<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0a0a0b"/>
  <!-- 5-speed H-pattern: |-|-| -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <!-- Three verticals -->
    <line x1="16" y1="16" x2="16" y2="48"/>
    <line x1="32" y1="16" x2="32" y2="48"/>
    <line x1="48" y1="16" x2="48" y2="48"/>
    <!-- Two horizontals connecting them -->
    <line x1="16" y1="32" x2="32" y2="32"/>
    <line x1="32" y1="32" x2="48" y2="32"/>
  </g>
  <!-- Gear position dot — 1st gear (top-left) -->
  <circle cx="16" cy="16" r="4.5" fill="#7dd3fc"/>
</svg>
